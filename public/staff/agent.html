<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Approved orders · Sereno</title>
  <link rel="preload" href="/assets/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/gilda-display-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/staff.css">
  <link rel="stylesheet" href="/css/theme.css">
  <script type="module" src="/js/agent.js"></script>
</head>
<body class="dark-body">
  <header class="site-header staff-header">
    <div class="site-header__inner agent-header">
      <a class="brand-link" href="/staff/agent.html">
        <span class="brand">Sereno</span>
        <span class="brand-link__tagline">quality. speed. comfort.</span>
      </a>
      <div class="staff-header__right">
        <span class="staff-role">Field agent</span>
        <button class="btn btn-small btn-on-dark" id="logout" type="button">Log out</button>
      </div>
    </div>
    <!-- Second row of the header (DESIGN screen 4, mockup 8): Orders and Archive -->
    <nav class="agent-tabs" aria-label="Staff sections">
      <a class="agent-tabs__tab" href="/staff/agent.html" aria-current="page">Orders</a>
      <a class="agent-tabs__tab" href="/staff/archive.html">Archive</a>
    </nav>
  </header>

  <main class="agent theme-dark">
    <div class="agent__head">
      <h1 class="h3">Approved orders</h1>
      <button class="btn btn-small btn-secondary" id="refresh" type="button">Refresh</button>
    </div>
    <p class="agent__status text-small" id="status-line" role="status"></p>
    <p class="alert-error" id="list-error" role="alert" hidden></p>
    <p class="text-soft" id="list-loading">Loading orders…</p>
    <p class="text-soft" id="list-empty" hidden>No approved orders.</p>
    <ul class="agent-list" id="order-list" aria-label="Approved orders"></ul>
    <p class="agent__archive-link"><a href="/staff/archive.html">Archive · opens on desktop</a></p>
  </main>
</body>
</html>
