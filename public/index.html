<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sereno (temporary page)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.8rem; text-align: left; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <!-- Temporary Milestone 1 page: checks the server connection. Replaced by the real landing page in M6. -->
  <h1>Sereno</h1>
  <p id="config-status">Loading config...</p>
  <h2>Flights</h2>
  <p id="flights-status">Loading flights...</p>
  <table id="flights" hidden>
    <thead>
      <tr><th>Flight</th><th>Airline</th><th>Destination</th><th>Departure (Israel time)</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const fmt = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Jerusalem', weekday: 'short', day: '2-digit', month: 'short',
      year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false,
    });

    async function getJson(path) {
      const res = await fetch(path);
      const body = await res.json().catch(() => null);
      if (!res.ok || !body || !body.ok) {
        throw new Error((body && body.error && body.error.message) || 'Request failed (' + res.status + ')');
      }
      return body.data;
    }

    function showError(el, prefix, err) {
      el.textContent = prefix + ': ' + err.message;
      el.className = 'error';
    }

    getJson('/api/config')
      .then((data) => {
        document.getElementById('config-status').textContent =
          'Config loaded: ' + data.lists.statuses.length + ' statuses, ' + data.lists.services.length + ' services.';
      })
      .catch((err) => showError(document.getElementById('config-status'), 'Config failed', err));

    getJson('/api/flights')
      .then((data) => {
        const status = document.getElementById('flights-status');
        const table = document.getElementById('flights');
        const tbody = table.querySelector('tbody');
        for (const f of data.flights) {
          const tr = document.createElement('tr');
          for (const value of [f.flight_no, f.airline || '', f.destination, fmt.format(new Date(f.departure_at))]) {
            const td = document.createElement('td');
            td.textContent = value;
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
        }
        status.textContent = data.flights.length + ' flights.';
        table.hidden = false;
      })
      .catch((err) => showError(document.getElementById('flights-status'), 'Flights failed', err));
  </script>
</body>
</html>
